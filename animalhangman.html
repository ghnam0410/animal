<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물과 에너지 행맨 게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jua & Gowun Dodum -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            /* 파스텔톤 살구색 배경 */
            background-color: #fff7ed; 
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        .key-btn {
            transition: all 0.15s ease-in-out;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .key-btn:active:not(:disabled) {
            transform: scale(0.92);
        }
        .burger-icon {
            transition: all 0.3s ease;
        }
        .burger-lost {
            filter: grayscale(100%) opacity(0.3);
            transform: scale(0.8);
        }
        
        /* 위 쪼그라듦 애니메이션 */
        .stomach-organ {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 100px 145px;
        }

        /* 꼬르륵 진동 효과 */
        @keyframes rumble {
            0%, 100% { transform: translate(0, 0) scale(var(--stomach-scale, 1)); }
            20% { transform: translate(-2px, 1px) scale(var(--stomach-scale, 1)); }
            40% { transform: translate(2px, -1px) scale(var(--stomach-scale, 1)); }
            60% { transform: translate(-1px, -2px) scale(var(--stomach-scale, 1)); }
            80% { transform: translate(1px, 2px) scale(var(--stomach-scale, 1)); }
        }
        .stomach-rumble {
            animation: rumble 0.6s infinite ease-in-out;
        }
        
        /* 스테이지 셀렉터 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 햄버거 이동 애니메이션용 */
        #burger-entity {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center text-slate-800 p-2 sm:p-4 select-none bg-gradient-to-b from-orange-100 via-orange-50 to-orange-100">

    <div class="w-full max-w-2xl mx-auto flex flex-col items-center flex-grow">
        
        <!-- Header -->
        <header class="w-full text-center mt-2 mb-4">
            <h1 class="font-jua text-3xl sm:text-4xl text-orange-600 tracking-wide drop-shadow-sm">
                🍔 동물과 에너지 행맨
            </h1>
            <p class="text-xs sm:text-sm text-orange-500 mt-1">
                단어를 맞혀 햄버거가 식도를 무사히 통과하게 도와주세요!
            </p>
        </header>

        <!-- Status Bar: Stage & Lives (Burgers) -->
        <div class="w-full bg-white/80 backdrop-blur rounded-2xl p-3 sm:p-4 shadow-sm border border-orange-200 mb-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2 w-full sm:w-auto justify-center sm:justify-start">
                <span class="font-jua text-lg text-orange-700">STAGE</span>
                <span id="stage-display" class="font-jua text-xl bg-orange-100 text-orange-800 px-4 py-0.5 rounded-full border border-orange-300">
                    1 / 22
                </span>
            </div>
            
            <div class="flex flex-col items-center sm:items-end w-full sm:w-auto">
                <div class="text-xs text-orange-600 mb-1 font-bold">남은 기회 (햄버거)</div>
                <!-- Flex-wrap added to handle up to 12 burgers nicely -->
                <div id="lives-container" class="flex flex-wrap justify-center sm:justify-end items-center gap-1 max-w-[200px] sm:max-w-none">
                    <!-- Burgers dynamically inserted here -->
                </div>
            </div>
        </div>

        <!-- Digestive System Display Canvas/SVG Container -->
        <div class="w-full bg-white rounded-2xl p-2 sm:p-4 shadow-md border border-orange-200 mb-4 flex flex-col items-center justify-center relative min-h-[200px]">
            <div id="anatomy-illustration" class="w-full h-48 sm:h-56 flex items-center justify-center">

        </div>

        <!-- Hint Box -->
        <div class="w-full bg-orange-50 rounded-xl p-3 border border-orange-200 mb-4 text-center">
            <span class="font-jua text-orange-800 text-sm bg-orange-200/80 px-2.5 py-0.5 rounded-md mr-1 shadow-sm">힌트</span>
            <span id="hint-text" class="text-sm sm:text-base text-slate-700 font-medium break-keep">
                힌트가 여기에 표시됩니다.
            </span>
        </div>

        <!-- Word Display Area -->
        <div id="word-display" class="w-full flex flex-wrap justify-center items-center gap-1.5 sm:gap-2 my-2 min-h-[50px]">
            <!-- Letters / Underscores dynamically inserted -->
        </div>

        <!-- Virtual Keyboard -->
        <div id="keyboard" class="w-full bg-white/60 p-2 sm:p-3 rounded-2xl shadow-sm border border-orange-200 mt-2 sm:mt-4">
            <!-- Row 1 -->
            <div class="flex justify-center gap-1 sm:gap-1.5 mb-1.5">
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="Q">Q</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="W">W</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="E">E</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="R">R</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="T">T</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="Y">Y</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="U">U</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="I">I</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="O">O</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="P">P</button>
            </div>
            <!-- Row 2 -->
            <div class="flex justify-center gap-1 sm:gap-1.5 mb-1.5">
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="A">A</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="S">S</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="D">D</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="F">F</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="G">G</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="H">H</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="J">J</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="K">K</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="L">L</button>
            </div>
            <!-- Row 3 -->
            <div class="flex justify-center gap-1 sm:gap-1.5">
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="Z">Z</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="X">X</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="C">C</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="V">V</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="B">B</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="N">N</button>
                <button class="key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="M">M</button>
            </div>
        </div>

        <!-- Stage Unlock Selector -->
        <div class="w-full mt-4">
            <div class="text-xs text-orange-600 font-bold mb-2 ml-1">단계 이동 (해금된 스테이지)</div>
            <div id="stage-selector" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 px-1 scroll-smooth">
                <!-- Stage buttons dynamically inserted -->
            </div>
        </div>

    </div>

    <!-- Result / Transition Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-orange-100 transform transition-all">
            <div id="modal-icon" class="text-6xl mb-4 drop-shadow-md">🎉</div>
            <h2 id="modal-title" class="font-jua text-2xl sm:text-3xl text-orange-600 mb-3 tracking-wide">정답입니다!</h2>
            <p id="modal-message" class="text-sm sm:text-base text-slate-600 mb-6 font-medium leading-relaxed">
                메시지
            </p>
            <button id="modal-btn" class="w-full bg-gradient-to-r from-orange-400 to-orange-500 hover:from-orange-500 hover:to-orange-600 active:scale-95 text-white font-jua text-lg py-3.5 rounded-xl shadow-lg transition-all focus:outline-none">
                버튼 (Enter)
            </button>
        </div>
    </div>

    <script>
        // Word List & Hints based on Middle School Science (Animals and Energy)
        const WORDS = [
            { word: "HEART", hint: "두 개의 심방과 두 개의 심실로 이루어져 온몸으로 혈액을 순환시키는 기관" }, // 1
            { word: "BLOOD", hint: "심장에서 나와 온몸을 순환하며 산소와 영양소 등을 운반하는 액체" }, // 2
            { word: "STOMACH", hint: "위액을 분비하여 단백질을 소화하며, 주머니 모양인 소화관" }, // 3
            { word: "PROTEIN", hint: "우리 몸의 근육 등을 구성하며, 아미노산으로 분해되는 영양소" }, // 4
            { word: "LIVER", hint: "쓸개즙을 만들어 쓸개로 보내 지방의 소화를 돕는 소화샘" }, // 5
            { word: "LUNG", hint: "산소를 흡수하고 이산화 탄소를 배출하는 호흡 기관" }, // 6
            { word: "KIDNEY", hint: "혈액 속 노폐물을 걸러 오줌을 만드는 배설 기관" }, // 7
            { word: "DIGESTION", hint: "커다란 영양소를 세포막을 통과할 수 있게 작은 영양소로 분해하는 과정" }, // 8
            { word: "CIRCULATION", hint: "심장의 운동으로 혈액이 혈관을 따라 온몸을 흐르며 물질을 운반하는 과정" }, // 9
            { word: "RESPIRATION", hint: "영양소를 분해하여 생명 활동에 필요한 에너지를 얻는 과정" }, // 10
            { word: "EXCRETION", hint: "세포의 생명 활동 결과 생긴 노폐물을 몸 밖으로 내보내는 과정" }, // 11
            { word: "CARBOHYDRATE", hint: "주로 에너지원으로 사용되며 녹말, 포도당 등이 포함된 영양소" }, // 12
            { word: "INTESTINE", hint: "소화가 완료되고 영양소와 물이 흡수되는 길고 굵은 관 (작은창자, 큰창자)" }, // 13
            { word: "ENZYME", hint: "소화액에 들어 있으며, 커다란 영양소를 작은 영양소로 분해하는 물질" }, // 14
            { word: "LIPID", hint: "에너지원으로 사용되며, 에너지를 저장하기도 함. 피부 아래에 이 물질로 이루어진 층이 체온 유지에 도움을 줌." }, // 15
            { word: "PANCREAS", hint: "이자액을 만들어 분비하며, 탄수화물, 단백질, 지방을 모두 소화하는 기관" }, // 16
            { word: "BRONCHI", hint: "폐로 공기가 들어가고 나가는 여러 갈래의 통로" }, // 17
            { word: "CAPILLARY", hint: "온몸의 세포 주변에 그물처럼 퍼져 있어 세포와 물질 교환이 일어나는 혈관" }, // 18
            { word: "VENTRICLE", hint: "심방보다 두껍고 탄력성이 강한 근육으로 이루어져 혈액을 동맥으로 내보내는 심장 부분" }, // 19
            { word: "ATRIUM", hint: "혈액을 심장으로 받아들이는 부분으로 정맥과 연결된 심장 부분" }, // 20
            { word: "AORTA", hint: "심장의 좌심실에서 나온 혈액이 온몸으로 나가는 가장 굵은 혈관" }, // 21
            { word: "VENA CAVA", hint: "온몸을 순환한 혈액이 우심방으로 들어오는 굵은 혈관" } // 22
        ];

        // State Variables
        let currentStage = 0;
        let highestUnlockedStage = 0; // Loaded from localStorage
        let currentWord = "";
        let currentHint = "";
        let guessedLetters = new Set();
        let mistakes = 0;
        let isGameOver = false;

        // Tone.js Setup
        let synth = null;
        function initAudio() {
            if (!synth && window.Tone) {
                try {
                    Tone.start();
                    synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    synth.volume.value = -8;
                } catch (e) { console.log("Audio Context Error", e); }
            }
        }
        function playCorrectSound() { try { initAudio(); if (synth) synth.triggerAttackRelease(["C5", "E5"], "8n"); } catch(e){} }
        function playWrongSound() { try { initAudio(); if (synth) synth.triggerAttackRelease(["D3", "A2"], "8n"); } catch(e){} }
        function playWinSound() { try { initAudio(); if (synth) synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n"); } catch(e){} }
        function playGameOverSound() { try { initAudio(); if (synth) synth.triggerAttackRelease(["G3", "Eb3", "C3", "G2"], "2n"); } catch(e){} }

        // DOM Elements
        const stageDisplay = document.getElementById("stage-display");
        const livesContainer = document.getElementById("lives-container");
        const anatomyIllustration = document.getElementById("anatomy-illustration");
        const hintText = document.getElementById("hint-text");
        const wordDisplay = document.getElementById("word-display");
        const keyboard = document.getElementById("keyboard");
        const stageSelector = document.getElementById("stage-selector");
        const modal = document.getElementById("modal");
        const modalIcon = document.getElementById("modal-icon");
        const modalTitle = document.getElementById("modal-title");
        const modalMessage = document.getElementById("modal-message");
        const modalBtn = document.getElementById("modal-btn");

        // Helper: Calculate max lives based on stage
        function getMaxLives(stageIndex) {
            if (stageIndex >= 13) return 12; // ENZYME and later
            if (stageIndex >= 7) return 10;  // DIGESTION and later
            return 8; // Default
        }

        // Generate Dynamic Anatomical SVG for Esophagus & Stomach with Real-time Flowing Hamburgers
        function renderAnatomySVG() {
            const maxLives = getMaxLives(currentStage);
            const remainingLives = Math.max(0, maxLives - mistakes);
            const mistakeRatio = mistakes / maxLives;

            // Stomach shrink scale (1.0 healthy down to 0.65 when starving)
            const stomachScale = (1 - (mistakeRatio * 0.38)).toFixed(2);
            
            // Color transitions: Healthy warm pink/rose (#fb7185) -> Starving pale blue-gray (#94a3b8)
            const r = Math.round(251 - (mistakeRatio * 103));
            const g = Math.round(113 + (mistakeRatio * 50));
            const b = Math.round(133 + (mistakeRatio * 51));
            const stomachColor = `rgb(${r}, ${g}, ${b})`;
            const strokeColor = mistakeRatio > 0.6 ? '#475569' : '#e11d48';

            // Real-time animation: generate moving hamburgers along esophagus path
            // Path from pharynx top (100,2) through esophagus to stomach cardia entrance (82,118)
            const motionPath = "M 100 2 C 98 30 88 60 88 88 C 88 102 93 110 82 118";

            // Number of hamburgers flowing continuously depends on remaining lives
            let burgerFlowHTML = "";
            if (remainingLives > 0) {
                // Determine number of visible flowing burgers (e.g. 1 to 5 based on remaining lives)
                const activeCount = Math.min(remainingLives, 5);
                const cycleDur = 2.4 + (mistakeRatio * 1.5); // Slower movement when starving

                for (let i = 0; i < activeCount; i++) {
                    const beginOffset = (i * (cycleDur / activeCount)).toFixed(2);
                    burgerFlowHTML += `
                        <g>
                            <text font-size="13" text-anchor="middle" dominant-baseline="central">🍔
                                <animateMotion 
                                    path="${motionPath}" 
                                    dur="${cycleDur}s" 
                                    begin="${beginOffset}s" 
                                    repeatCount="indefinite" />
                                <animate attributeName="opacity" values="0;1;1;0.3" keyTimes="0;0.15;0.85;1" dur="${cycleDur}s" begin="${beginOffset}s" repeatCount="indefinite" />
                                <animate attributeName="font-size" values="10;14;13;8" keyTimes="0;0.3;0.8;1" dur="${cycleDur}s" begin="${beginOffset}s" repeatCount="indefinite" />
                            </text>
                        </g>
                    `;
                }
            }

            // Stomach inner Gastric Juice / Acid height decrease / rumble effect
            const acidY = 145 + (mistakeRatio * 20);
            const isRumbling = mistakeRatio >= 0.5 && remainingLives > 0;

            const svg = `
                <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Esophagus Tissue Gradient -->
                        <linearGradient id="esoGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#fca5a5"/>
                            <stop offset="50%" stop-color="#f87171"/>
                            <stop offset="100%" stop-color="#fca5a5"/>
                        </linearGradient>

                        <!-- Gastric Acid Gradient -->
                        <linearGradient id="acidGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#bef264" stop-opacity="0.75"/>
                            <stop offset="100%" stop-color="#84cc16" stop-opacity="0.9"/>
                        </linearGradient>
                    </defs>

                    <!-- Anatomical Esophagus Tube (Slight curved natural anatomical path) -->
                    <!-- Outer Esophagus Muscular Wall -->
                    <path d="M 100 0 C 98 30 88 60 88 88 C 88 105 94 112 82 120" 
                          fill="none" stroke="url(#esoGrad)" stroke-width="20" stroke-linecap="round"/>
                    <path d="M 100 0 C 98 30 88 60 88 88 C 88 105 94 112 82 120" 
                          fill="none" stroke="${strokeColor}" stroke-width="2" opacity="0.4"/>

                    <!-- Real-time Flowing Hamburgers along Esophagus Path -->
                    ${burgerFlowHTML}

                    <!-- Stomach Organ (Anatomical: Fundus, Greater Curvature, Lesser Curvature, Pylorus) -->
                    <g class="stomach-organ ${isRumbling ? 'stomach-rumble' : ''}" 
                       style="transform: scale(${stomachScale}); --stomach-scale: ${stomachScale};">
                        
                        <!-- Stomach Main Tissue Body -->
                        <!-- Path: Entrance(Cardia) -> Fundus(top bulge) -> Greater Curvature(left/outer) -> Pylorus -> Lesser Curvature -->
                        <path d="M 82 118 
                                 C 85 102, 122 96, 138 112 
                                 C 155 128, 150 168, 125 182 
                                 C 95 192, 52 178, 55 145 
                                 C 57 126, 75 125, 82 118 Z" 
                              fill="${stomachColor}" 
                              stroke="${strokeColor}" 
                              stroke-width="3.5" 
                              stroke-linejoin="round"/>

                        <!-- Stomach Rugae (Mucosal Folds Interior Lines) -->
                        <path d="M 72 135 C 75 152, 90 170, 115 172" fill="none" stroke="${strokeColor}" stroke-width="1.5" opacity="0.3" stroke-dasharray="3 2"/>
                        <path d="M 88 130 C 95 145, 110 162, 130 158" fill="none" stroke="${strokeColor}" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 2"/>

                        <!-- Duodenum Connection (소장 연결 부위 / 십이지장) -->
                        <path d="M 125 182 C 140 185, 155 178, 160 165" fill="none" stroke="url(#esoGrad)" stroke-width="12" stroke-linecap="round"/>
                        <path d="M 125 182 C 140 185, 155 178, 160 165" fill="none" stroke="${strokeColor}" stroke-width="2" opacity="0.5"/>

                        <!-- Gastric Acid Level inside Stomach -->
                        ${remainingLives > 0 ? `
                            <path d="M 58 150 Q 95 ${acidY} 138 155 C 132 172, 110 182, 88 180 C 68 178, 58 165, 58 150 Z" 
                                  fill="url(#acidGrad)"/>
                        ` : ''}

                        <!-- Expression / Starvation Visuals inside Stomach -->
                        ${mistakeRatio === 0 ? `
                            <!-- Healthy / Full Stomach Expression -->
                            <circle cx="95" cy="138" r="2.5" fill="#881337"/>
                            <circle cx="115" cy="138" r="2.5" fill="#881337"/>
                            <path d="M 100 146 Q 105 152 110 146" fill="none" stroke="#881337" stroke-width="2" stroke-linecap="round"/>
                            <text x="125" y="132" font-size="11">✨</text>
                        ` : mistakeRatio < 0.7 ? `
                            <!-- Hungry / Mildly Starving Stomach -->
                            <circle cx="95" cy="138" r="2" fill="#475569"/>
                            <circle cx="115" cy="138" r="2" fill="#475569"/>
                            <path d="M 100 148 Q 105 143 110 148" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
                            <text x="132" y="120" font-size="12">💦</text>
                        ` : remainingLives > 0 ? `
                            <!-- Severe Hunger / Starving & Shriveling Stomach -->
                            <text x="92" y="140" font-size="12">x</text>
                            <text x="112" y="140" font-size="12">x</text>
                            <path d="M 98 150 L 112 150" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
                            <text x="130" y="118" font-size="14">💧</text>
                            <text x="40" y="135" font-size="11" fill="#dc2626" font-weight="bold">꼬르륵!</text>
                        ` : `
                            <!-- Game Over Empty / Shriveled Stomach -->
                            <text x="90" y="142" font-size="14">☠️</text>
                            <text x="65" y="125" font-size="14">💨</text>
                        `}
                    </g>
                </svg>
            `;
            anatomyIllustration.innerHTML = svg;
        }

        function renderLives() {
            const maxLives = getMaxLives(currentStage);
            livesContainer.innerHTML = "";
            for (let i = 0; i < maxLives; i++) {
                const burger = document.createElement("div");
                // From right to left, if i >= maxLives - mistakes, it's lost
                const isLost = i >= (maxLives - mistakes);
                burger.className = `burger-icon text-xl sm:text-2xl ${isLost ? 'burger-lost' : ''}`;
                burger.textContent = "🍔";
                livesContainer.appendChild(burger);
            }
        }

        function renderWord() {
            wordDisplay.innerHTML = "";
            let isComplete = true;

            for (const char of currentWord) {
                if (char === " ") {
                    // Handle spaces (e.g., VENA CAVA)
                    const spaceBox = document.createElement("div");
                    spaceBox.className = "w-4 sm:w-6 h-10"; // Just empty space
                    wordDisplay.appendChild(spaceBox);
                    continue;
                }

                const letterBox = document.createElement("div");
                letterBox.className = "w-9 h-12 sm:w-11 sm:h-14 bg-white border-b-4 border-orange-300 rounded-t-md flex items-center justify-center font-jua text-2xl text-orange-900 shadow-sm transition-all";

                if (guessedLetters.has(char)) {
                    letterBox.textContent = char;
                    letterBox.classList.add("bg-orange-50", "border-orange-500", "scale-105");
                } else {
                    letterBox.textContent = "?";
                    letterBox.classList.add("text-transparent", "border-slate-300");
                    isComplete = false;
                }
                wordDisplay.appendChild(letterBox);
            }

            // Check Win condition
            if (isComplete && currentWord.length > 0 && !isGameOver) {
                handleStageClear();
            }
        }

        function renderStageSelector() {
            stageSelector.innerHTML = "";
            for (let i = 0; i < WORDS.length; i++) {
                const btn = document.createElement("button");
                const isUnlocked = i <= highestUnlockedStage;
                
                btn.className = `flex-shrink-0 w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex flex-col items-center justify-center font-jua text-lg transition-all focus:outline-none ${
                    i === currentStage 
                    ? 'bg-orange-500 text-white shadow-md ring-2 ring-orange-300 ring-offset-1 scale-110' 
                    : isUnlocked 
                        ? 'bg-orange-100 text-orange-800 hover:bg-orange-200 border border-orange-200' 
                        : 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                }`;
                
                if (isUnlocked) {
                    btn.textContent = i + 1;
                    btn.onclick = () => {
                        if (currentStage !== i) loadStage(i);
                    };
                } else {
                    btn.innerHTML = `<span class="text-xs mb-0.5">${i+1}</span><span class="text-sm">🔒</span>`;
                }
                
                stageSelector.appendChild(btn);
            }
            
            // Scroll selected into view slightly
            const activeBtn = stageSelector.children[currentStage];
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        function resetKeyboard() {
            const buttons = keyboard.querySelectorAll("button");
            buttons.forEach(btn => {
                btn.disabled = false;
                btn.className = "key-btn bg-white hover:bg-orange-50 text-slate-700 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base";
            });
        }

        function loadStage(stageIndex) {
            currentStage = stageIndex;
            currentWord = WORDS[currentStage].word;
            currentHint = WORDS[currentStage].hint;
            guessedLetters.clear();
            mistakes = 0;
            isGameOver = false;

            stageDisplay.textContent = `${currentStage + 1} / ${WORDS.length}`;
            hintText.textContent = currentHint;

            resetKeyboard();
            renderLives();
            renderAnatomySVG();
            renderWord();
            renderStageSelector();
            hideModal();
        }

        function makeGuess(letter) {
            if (isGameOver || guessedLetters.has(letter)) return;

            guessedLetters.add(letter);

            // Update Keyboard Button UI
            const btn = keyboard.querySelector(`button[data-key="${letter}"]`);
            if (btn) {
                btn.disabled = true;
                if (currentWord.includes(letter)) {
                    btn.className = "key-btn bg-orange-400 text-white font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-orange-500 shadow-inner opacity-90 cursor-not-allowed scale-95";
                } else {
                    btn.className = "key-btn bg-slate-200 text-slate-400 font-bold py-2 sm:py-2.5 px-2 sm:px-3 rounded-lg border border-slate-300 shadow-inner opacity-60 cursor-not-allowed scale-95";
                }
            }

            if (currentWord.includes(letter)) {
                playCorrectSound();
                renderAnatomySVG(); // Update burger position
                renderWord();
            } else {
                mistakes++;
                playWrongSound();
                renderLives();
                renderAnatomySVG(); // Update stomach color/acid

                const maxLives = getMaxLives(currentStage);
                if (mistakes >= maxLives) {
                    handleGameOver();
                }
            }
        }

        function handleStageClear() {
            isGameOver = true;
            playWinSound();
            renderAnatomySVG(); // Show final sparkles

            // Unlock next stage
            if (currentStage + 1 > highestUnlockedStage && currentStage < WORDS.length - 1) {
                highestUnlockedStage = currentStage + 1;
                // Save to localStorage
                localStorage.setItem('animalHangmanProgress', highestUnlockedStage);
            }

            setTimeout(() => {
                if (currentStage < WORDS.length - 1) {
                    showModal("🔋", "정답입니다!", 
                        `<span class="text-orange-600 font-bold text-lg">${currentWord}</span><br>햄버거가 무사히 소화되어 에너지가 되었습니다!`, 
                        "다음 단계로 (Enter)");
                } else {
                    showModal("🏆", "완벽한 소화!", 
                        "동물과 에너지 단원의 모든 지식을 소화하셨습니다!<br>훌륭합니다!", 
                        "처음부터 다시하기 (Enter)");
                }
            }, 600); // slight delay to watch animation
        }

        function handleGameOver() {
            isGameOver = true;
            playGameOverSound();
            
            // Re-render word to reveal answer
            wordDisplay.innerHTML = "";
            for (const char of currentWord) {
                if (char === " ") {
                    const spaceBox = document.createElement("div"); spaceBox.className = "w-4 sm:w-6 h-10"; wordDisplay.appendChild(spaceBox);
                    continue;
                }
                const letterBox = document.createElement("div");
                letterBox.className = "w-9 h-12 sm:w-11 sm:h-14 border-b-4 rounded-t-md flex items-center justify-center font-jua text-2xl shadow-sm";
                letterBox.textContent = char;
                if (guessedLetters.has(char)) {
                    letterBox.classList.add("bg-orange-50", "border-orange-500", "text-orange-900");
                } else {
                    letterBox.classList.add("bg-red-50", "border-red-400", "text-red-500", "animate-pulse"); // Highlight missed letters
                }
                wordDisplay.appendChild(letterBox);
            }

            setTimeout(() => {
                showModal("💀", "게임 오버!", 
                    `햄버거가 부족해 굶어 죽었습니다!<br>정답은 <strong class="text-orange-600 text-lg">${currentWord}</strong> 였습니다.`, 
                    "다시 도전하기 (Enter)");
            }, 800);
        }

        function showModal(icon, title, message, btnText) {
            modalIcon.textContent = icon;
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            modalBtn.textContent = btnText;
            modal.classList.remove("hidden");
            // small delay to prevent immediate enter key trigger if holding it
            setTimeout(() => modalBtn.focus(), 100);
        }

        function hideModal() {
            modal.classList.add("hidden");
        }

        function handleModalClick() {
            if (mistakes >= getMaxLives(currentStage)) {
                // Restart current stage on Game Over (Does NOT reset progress)
                loadStage(currentStage);
            } else if (currentStage < WORDS.length - 1) {
                // Move to next stage
                loadStage(currentStage + 1);
            } else {
                // Finished the game, restart from 0 but keep unlocks
                loadStage(0);
            }
        }

        // Virtual Keyboard Listener
        keyboard.addEventListener("click", (e) => {
            const target = e.target.closest("button");
            if (target && !target.disabled) {
                const key = target.getAttribute("data-key");
                if (key) makeGuess(key);
            }
        });

        // Physical Keyboard Listener
        window.addEventListener("keydown", (e) => {
            if (!modal.classList.contains("hidden")) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    handleModalClick();
                }
                return;
            }

            if (e.key === "Enter" && isGameOver) {
                handleModalClick();
                return;
            }

            const key = e.key.toUpperCase();
            if (/^[A-Z]$/.test(key)) {
                makeGuess(key);
            }
        });

        modalBtn.addEventListener("click", handleModalClick);

        // Initialization
        window.onload = () => {
            // Load saved progress
            const saved = localStorage.getItem('animalHangmanProgress');
            if (saved) {
                highestUnlockedStage = parseInt(saved, 10);
                // Clamp just in case
                if (highestUnlockedStage >= WORDS.length) highestUnlockedStage = WORDS.length - 1;
            }
            
            // Start at the highest unlocked stage (or 0 if new)
            loadStage(highestUnlockedStage);
        };
    </script>
</body>
</html>
